<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜 · F1 檔案庫</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="standings">
  <header class="site-header">
    <a class="brand" href="index.html">F1<span>檔案庫</span></a>
    <nav class="site-nav">
      <a href="standings.html" class="active">排行榜</a>
      <a href="schedule.html">賽程</a>
      <a href="teams.html">車隊歷史</a>
      <a href="drivers.html">車手歷史</a>
      <a href="retired.html">退役車手</a>
      <a href="moments.html">歷史名場面</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="index.html">首頁</a> / 排行榜</div>
      <h1>車手與車隊排行榜</h1>
      <p>數據來自 Jolpica F1 API，每場比賽結束後更新。頁面每 5 分鐘自動刷新，也可點擊「刷新」立即更新。</p>
    </div>

    <div class="standings-tabs">
      <button class="tab active" data-type="drivers">車手排行榜</button>
      <button class="tab" data-type="constructors">車隊積分榜</button>
    </div>

    <div class="standings-meta">
      <span id="season-info">載入中…</span>
      <span id="updated"></span>
      <button class="btn" id="refresh">刷新</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="error-box" id="error" hidden></div>
  </main>

  <footer>F1 檔案庫 · 積分數據來源：Jolpica F1 API · <a href="https://github.com/Yun961127/F1-work" target="_blank" rel="noopener">GitHub</a></footer>
  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/standings.js"></script>
</body>
</html>
