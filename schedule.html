<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賽程與結果 · F1 檔案庫</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">F1<span>檔案庫</span></a>
    <nav class="site-nav">
      <a href="standings.html">排行榜</a>
      <a href="schedule.html" class="active">賽程</a>
      <a href="teams.html">車隊歷史</a>
      <a href="drivers.html">車手歷史</a>
      <a href="retired.html">退役車手</a>
      <a href="moments.html">歷史名場面</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="index.html">首頁</a> / 賽程</div>
      <h1>賽程與比賽結果</h1>
      <p>全年賽程來自 Jolpica F1 API。已結束的比賽顯示前三名，未來的比賽顯示開賽日期。</p>
    </div>

    <div class="standings-meta">
      <span id="season-info">載入中…</span>
      <span id="updated"></span>
      <button class="btn" id="refresh">刷新</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>輪次</th><th>日期</th><th>大獎賽</th><th>賽道</th><th>結果</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="error-box" id="error" hidden></div>
  </main>

  <footer>F1 檔案庫 · 賽程數據來源：Jolpica F1 API · <a href="https://github.com/Yun961127/F1-work" target="_blank" rel="noopener">GitHub</a></footer>
  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
